name: h2orbit
description: "H2Orbit - a smart water and hydration tracker built with Flutter and Firebase."

publish_to: 'none' 

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  cloud_firestore: ^6.0.3
  intl: ^0.20.2
  geolocator: ^14.0.2
  http: ^1.5.0
  firebase_auth: ^6.1.1
  shared_preferences: ^2.5.3
  lottie: ^3.3.2
  firebase_core: ^4.2.0
  provider: ^6.1.5+1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/goal.json
    - assets/animations/brain.json
    - assets/animations/glass.json
    - assets/animations/bell.json
    - assets/animations/splash.json
    - assets/animations/water.json
    - assets/animations/water2.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Launcher icons are generated from assets/images (see tool/generate_logo.py):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/launcher_background.png"
  adaptive_icon_foreground: "assets/images/launcher_foreground.png"
  web:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    background_color: "#0A1828"
    theme_color: "#0E7F9A"
  windows:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    icon_size: 256
